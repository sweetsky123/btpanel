<div class="box_weixin conter_box"><div class="bt-form"><div class="line"><span class="tname">通知全体</span><div class="info-r" style="height:28px;margin-left:100px"><input checked="checked" class="btswitch btswitch-ios" disabled="disabled" id="panel_alert_all" type="checkbox"> <label class="btswitch-btn" for="panel_alert_all" style="position:relative;top:5px" title="仅支持通知全体."></label></div></div><div class="line"><span class="tname">微信URL</span><div class="info-r"><textarea class="bt-input-text mr5" name="channel_weixin_value" placeholder="请输入微信url" style="width:300px;height:90px;line-height:20px" type="text"></textarea></div><button class="btn btn-sm btn-success weixin_submit" style="margin:10px 0 0 100px">保存</button></div><div class="line"><ul class="c7 help-info-text"><li>默认通知全体，不可更改</ul></div></div></div><script>var weixin={all_info:{},init:function(){this.all_info=$(".alarm-view .bt-w-menu p.bgw").data("data"),this.get_weixin_data()},get_weixin_data:function(){var a=this;weixin.all_info.data&&$("textarea[name=channel_weixin_value]").val(weixin.all_info.data.weixin_url),$(".weixin_submit").click(function(){a.set_submit_ding()})},set_submit_ding:function(){var a=this,i=$("textarea[name=channel_weixin_value]").val();if(""==i)return layer.msg("请输入微信url",{icon:2});var n=layer.msg("正在设置微信通道中,请稍候...",{icon:16,time:0,shade:[.3,"#000"]});$.post("/config?action=set_msg_config&name=weixin",{url:i,atall:"True"},function(i){layer.close(n),layer.msg(i.msg,{icon:i.status?1:2}),i.status&&a.refresh_data()})},refresh_data:function(){var a=this;$.post("/config?action=get_msg_configs",function(i){$.each(i,function(i,n){n.name==a.all_info.name&&$(".alarm-view .bt-w-menu p.bgw").data("data",n)})})}}</script>
